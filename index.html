<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>مسابقة توقع كأس العالم 2026 | إعداد حسن العاقول</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Bebas+Neue&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#F0D080;--gold3:#ffeaa0;
  --dark:#060d1a;--darker:#03070f;--card:#0c1628;--card2:#101d2e;--card3:#141f30;
  --border:#1a2d45;--border2:#233550;
  --green:#00c853;--red:#f44336;--blue:#3d8ef0;--orange:#ff9800;--purple:#9c27b0;
  --text:#d8e8f8;--muted:#5a7494;--muted2:#7a94b4;
  --r:12px;--r2:8px;
}
html{font-size:18.5px}
@media(max-width:480px){html{font-size:17.5px}}
html,body{font-family:'Tajawal',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── HERO ── */
.hero{
  background:linear-gradient(170deg,#040c1c 0%,#0d1e38 55%,#040c1c 100%);
  padding:2rem 1rem 1.5rem;text-align:center;position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);
}
.hero-bg{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%,rgba(201,168,76,.2) 0%,transparent 60%),
    radial-gradient(circle at 10% 80%,rgba(61,142,240,.08) 0%,transparent 40%),
    radial-gradient(circle at 90% 80%,rgba(61,142,240,.08) 0%,transparent 40%);
}
.hero-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
.trophy-wrap{position:relative;display:inline-block;margin-bottom:.5rem}
.trophy-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.3) 0%,transparent 70%);animation:pulse-glow 2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.trophy-emoji{font-size:3.8rem;display:block;position:relative;animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(201,168,76,.6))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;letter-spacing:5px;line-height:1;background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative}
.hero-sub{font-size:.8rem;color:var(--muted2);margin-top:.3rem;letter-spacing:.5px}
.hero-credit{font-size:.72rem;color:var(--gold);opacity:.75;margin-top:.25rem;font-weight:500}
.hero-stats{display:flex;justify-content:center;gap:1.5rem;margin-top:1rem}
.hero-stat{text-align:center}
.hero-stat-n{font-size:1.3rem;font-weight:700;color:var(--gold2);font-family:'Cairo',sans-serif}
.hero-stat-l{font-size:.65rem;color:var(--muted);margin-top:.1rem}

/* ── TABS ── */
.tabs{display:flex;background:var(--darker);border-bottom:1px solid var(--border);overflow-x:auto;gap:0;position:sticky;top:0;z-index:100}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.7rem .875rem;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .2s;display:flex;align-items:center;gap:.3rem}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.05)}
.tab:hover:not(.active){color:var(--text)}

/* ── PAGES ── */
.page{display:none;padding:1rem;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:.75rem}
.card2{background:var(--card2);border:1px solid var(--border);border-radius:var(--r2);padding:.875rem;margin-bottom:.6rem}
.glass{background:rgba(12,22,40,.8);backdrop-filter:blur(12px);border:1px solid rgba(201,168,76,.15)}

/* ── INPUTS ── */
input,select,textarea{
  background:rgba(3,7,15,.8);border:1px solid var(--border2);color:var(--text);
  border-radius:var(--r2);padding:.55rem .875rem;font-family:'Tajawal',sans-serif;
  font-size:.82rem;width:100%;direction:rtl;transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.15)}
input[type=number]::-webkit-inner-spin-button{opacity:1}

/* ── BUTTONS ── */
.btn{
  background:linear-gradient(135deg,#b8872a,#8a6015);
  color:#fff3d0;border:none;border-radius:var(--r2);
  padding:.6rem 1.25rem;font-family:'Tajawal',sans-serif;font-weight:700;
  font-size:.82rem;cursor:pointer;transition:all .2s;width:100%;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  box-shadow:0 2px 12px rgba(184,135,42,.3);
}
.btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px);box-shadow:0 4px 18px rgba(184,135,42,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted2);box-shadow:none}
.btn-outline:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn-green{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#c8e6c9;box-shadow:0 2px 12px rgba(46,125,50,.3)}
.btn-red{background:linear-gradient(135deg,#b71c1c,#7f0000);color:#ffd7d7;box-shadow:none}
.btn-blue{background:linear-gradient(135deg,#1565c0,#1976d2);color:#bbdefb;box-shadow:none}
.btn-sm{padding:.38rem .75rem;font-size:.76rem;width:auto}

/* ── LABELS ── */
label{font-size:.76rem;color:var(--muted2);display:block;margin-bottom:.3rem;font-weight:500}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:.2rem;padding:.18rem .55rem;border-radius:20px;font-size:.68rem;font-weight:700;line-height:1.4}
.bg{background:rgba(201,168,76,.18);color:var(--gold)}
.bb{background:rgba(244,67,54,.14);color:var(--red)}
.bgr{background:rgba(0,200,83,.14);color:var(--green)}
.bbl{background:rgba(61,142,240,.14);color:var(--blue)}
.bm{background:rgba(90,116,148,.18);color:var(--muted2)}
.bo{background:rgba(255,152,0,.15);color:var(--orange)}
.bpu{background:rgba(156,39,176,.15);color:var(--purple)}

/* ── MATCH CARD ── */
.match-card{
  background:linear-gradient(135deg,var(--card2),var(--card3));
  border:1px solid var(--border);border-radius:var(--r);
  padding:.875rem;margin-bottom:.625rem;
  transition:border-color .2s,transform .15s;
  position:relative;overflow:hidden;
}
.match-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),transparent);
  opacity:0;transition:opacity .2s;
}
.match-card:hover::before{opacity:1}
.match-card.live-card{border-color:rgba(244,67,54,.4);animation:live-pulse 2s ease-in-out infinite}
@keyframes live-pulse{0%,100%{border-color:rgba(244,67,54,.4)}50%{border-color:rgba(244,67,54,.8)}}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;margin:.5rem 0}
.team-side{text-align:center}
.team-flag{font-size:1.8rem;display:block;line-height:1.2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.team-name{font-size:.72rem;color:var(--muted2);margin-top:.2rem;line-height:1.2;font-weight:500}
.vs-box{
  background:rgba(3,7,15,.6);border:1px solid var(--border2);
  border-radius:10px;padding:.4rem .55rem;text-align:center;min-width:52px;
}
.score-inputs{display:grid;grid-template-columns:1fr 20px 1fr;gap:.4rem;align-items:center}
.score-input{text-align:center;font-size:1.15rem;font-weight:700;padding:.45rem;direction:ltr;border-radius:10px}

/* ── STATS GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.625rem;margin-bottom:.875rem}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:.75rem;text-align:center;position:relative;overflow:hidden;
}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4}
.stat-n{font-size:1.6rem;font-weight:700;color:var(--gold);font-family:'Cairo',sans-serif}
.stat-l{font-size:.65rem;color:var(--muted);margin-top:.1rem}

/* ── LEADERBOARD ── */
.rank-item{
  display:flex;align-items:center;gap:.625rem;
  padding:.7rem .75rem;background:var(--card2);
  border:1px solid var(--border);border-radius:var(--r2);
  margin-bottom:.45rem;transition:border-color .2s;
}
.rank-item:hover{border-color:var(--border2)}
.rank-item.rank-1{border-color:rgba(255,215,0,.35);background:linear-gradient(135deg,rgba(255,215,0,.08),var(--card2))}
.rank-item.rank-2{border-color:rgba(192,192,192,.25)}
.rank-item.rank-3{border-color:rgba(205,127,50,.25)}
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin-top:.25rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold3));border-radius:2px;transition:width .8s ease}

/* ── SECTION TITLE ── */
.sec-title{
  font-size:.88rem;font-weight:700;color:var(--gold);
  margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem;
  padding-bottom:.5rem;border-bottom:1px solid rgba(201,168,76,.15);
}
.sec-title .icon{font-size:1rem}

/* ── MESSAGES ── */
.msg{padding:.55rem .875rem;border-radius:var(--r2);font-size:.78rem;margin-bottom:.625rem;display:none;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.msg.show{display:block}
.msg-ok{background:rgba(0,200,83,.1);border:1px solid rgba(0,200,83,.3);color:var(--green)}
.msg-err{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.3);color:var(--red)}

/* ── MISC ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}
.group-header{
  background:linear-gradient(135deg,rgba(201,168,76,.1),rgba(201,168,76,.03));
  border:1px solid rgba(201,168,76,.2);border-radius:var(--r2);
  padding:.4rem .75rem;margin-bottom:.6rem;font-size:.78rem;font-weight:700;
  color:var(--gold);display:flex;align-items:center;gap:.5rem;
}
.filter-tabs{display:flex;gap:.35rem;margin-bottom:.875rem;overflow-x:auto;padding-bottom:3px}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{
  padding:.28rem .7rem;border-radius:20px;font-size:.72rem;cursor:pointer;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap;flex-shrink:0;
  transition:all .2s;font-weight:500;
}
.ftab.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.1)}
.scroll-area{overflow-y:auto;max-height:65vh;padding-right:2px}
.scroll-area::-webkit-scrollbar{width:3px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.82rem}
.empty-icon{font-size:2.5rem;display:block;margin-bottom:.625rem;opacity:.5}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse-dot 1.2s infinite;vertical-align:middle;margin-left:3px}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.divider{text-align:center;color:var(--muted);font-size:.7rem;margin:.7rem 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.divider::before{right:0}.divider::after{left:0}
.venue-text{font-size:.66rem;color:var(--muted);text-align:center;margin:.3rem 0}
.login-wrap{max-width:360px;margin:1.5rem auto}

/* ── WELCOME / RULES ── */
.rules-card{
  background:linear-gradient(160deg,#070e1e 0%,#0d1828 100%);
  border:1px solid rgba(201,168,76,.3);border-radius:16px;
  padding:1.25rem;margin-bottom:.875rem;position:relative;overflow:hidden;
}
.rules-card::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,.15) 0%,transparent 70%);
}
.rule-row{display:flex;gap:.625rem;align-items:flex-start;margin-bottom:.625rem;font-size:.8rem;line-height:1.5}
.rule-icon{font-size:1.05rem;flex-shrink:0;margin-top:.05rem}
.check-area{
  background:rgba(0,200,83,.06);border:1px solid rgba(0,200,83,.25);
  border-radius:var(--r);padding:.875rem;margin:1rem 0;
  display:flex;align-items:center;gap:.75rem;cursor:pointer;
  transition:background .2s;
}
.check-area:hover{background:rgba(0,200,83,.1)}
.check-area input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--green);flex-shrink:0}
.check-area label{font-size:.82rem;color:var(--text);cursor:pointer;margin:0;font-weight:500}

/* ── SHARE CARD ── */
.share-card{
  background:linear-gradient(145deg,#040c1e,#0a1830,#040c1e);
  border:2px solid rgba(201,168,76,.5);border-radius:20px;
  padding:1.5rem;text-align:center;margin-bottom:1rem;
  position:relative;overflow:hidden;
}
.share-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(201,168,76,.15) 0%,transparent 60%);
}
.share-card-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;color:var(--gold2);position:relative}
.share-card-sub{font-size:.75rem;color:var(--muted2);margin-top:.25rem;position:relative}
.rules-mini{text-align:right;margin:1rem 0;position:relative}
.rules-mini-row{display:flex;align-items:center;gap:.5rem;font-size:.75rem;margin-bottom:.4rem;color:var(--text)}
.share-footer{font-size:.65rem;color:var(--muted);margin-top:1rem;position:relative;border-top:1px solid rgba(201,168,76,.2);padding-top:.75rem}
.qr-placeholder{
  width:80px;height:80px;border:2px solid var(--border2);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;color:var(--muted);margin:0 auto .75rem;
  background:rgba(0,0,0,.3);
}
.share-btns{display:flex;gap:.5rem;margin-top:1rem}
.share-btn{
  flex:1;padding:.5rem;border-radius:var(--r2);border:none;cursor:pointer;
  font-family:'Tajawal',sans-serif;font-size:.75rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:.3rem;
  transition:all .2s;
}
.share-whatsapp{background:#25d366;color:#fff}
.share-copy{background:var(--card2);border:1px solid var(--border2);color:var(--muted2)}
.share-copy:hover{border-color:var(--gold);color:var(--gold)}

/* ── NOTIFICATIONS ── */
.notif-banner{
  position:fixed;bottom:1rem;left:1rem;right:1rem;
  background:linear-gradient(135deg,var(--card),var(--card2));
  border:1px solid var(--border2);border-radius:var(--r);
  padding:.75rem 1rem;display:flex;align-items:center;gap:.625rem;
  z-index:999;transform:translateY(100px);opacity:0;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.notif-banner.show{transform:translateY(0);opacity:1}
.notif-icon{font-size:1.2rem;flex-shrink:0}
.notif-text{flex:1;font-size:.8rem}
.notif-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:.2rem}

/* ── PROFILE AVATAR ── */
.avatar{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,rgba(201,168,76,.35),rgba(201,168,76,.1));
  border:2px solid rgba(201,168,76,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:700;color:var(--gold2);margin:0 auto .875rem;
  box-shadow:0 0 20px rgba(201,168,76,.2);
}

/* ── COUNTDOWN ── */
.countdown-box{
  display:inline-flex;gap:.4rem;align-items:center;
  background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);
  border-radius:var(--r2);padding:.3rem .625rem;font-size:.72rem;
}
.cd-num{font-weight:700;color:var(--gold);font-family:'Cairo',sans-serif}
.cd-sep{color:var(--muted);margin:0 .1rem}

/* ── RESPONSIVE ── */
@media(max-width:380px){
  .hero h1{font-size:2.2rem;letter-spacing:3px}
  .stat-n{font-size:1.3rem}
}
</style>
</head>
<body>

<!-- Stars background -->
<div id="stars-bg"></div>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="trophy-wrap">
    <div class="trophy-glow"></div>
    <span class="trophy-emoji">🏆</span>
  </div>
  <h1>WORLD CUP 2026</h1>
  <p class="hero-sub">مسابقة توقع نتائج كأس العالم • أمريكا الشمالية</p>
  <p class="hero-credit">إعداد: حسن العاقول <span style="opacity:.5;font-size:.6rem">v3.0</span></p>
  <div class="hero-stats" id="hero-stats" style="display:none">
    <div class="hero-stat"><div class="hero-stat-n" id="hs-players">0</div><div class="hero-stat-l">مشارك</div></div>
    <div class="hero-stat"><div class="hero-stat-n" id="hs-matches">104</div><div class="hero-stat-l">مباراة</div></div>
    <div class="hero-stat"><div class="hero-stat-n" id="hs-top">0</div><div class="hero-stat-l">أعلى نقاط</div></div>
  </div>
</div>

<div id="app-root"></div>

<!-- Notification banner -->
<div class="notif-banner" id="notif">
  <span class="notif-icon" id="notif-icon">✅</span>
  <span class="notif-text" id="notif-text"></span>
  <button class="notif-close" onclick="closeNotif()">✕</button>
</div>

<script>
// ═══════════════════════════════════════
// DATABASE (localStorage)
// ═══════════════════════════════════════
// ═══════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyBUFY8ToqvWZlt0rjFUA6_rnncLTuw5KwM",
  authDomain: "worldcup2026-30642.firebaseapp.com",
  projectId: "worldcup2026-30642",
  storageBucket: "worldcup2026-30642.firebasestorage.app",
  messagingSenderId: "99018440514",
  appId: "1:99018440514:web:441bba59af4c05a1c3d2db"
};
let fdb=null, FB_OK=false;
try{
  firebase.initializeApp(firebaseConfig);
  fdb=firebase.firestore();
  FB_OK=true;
}catch(e){console.warn('Firebase init failed, using local only:',e);}

// ═══════════════════════════════════════
// DATA LAYER (Firestore + local cache)
// ═══════════════════════════════════════
const SK='wcp2026v4_';
// In-memory cache, hydrated from Firestore (or localStorage fallback)
const CACHE={ users:null, matches:null, predictions:null };

const DB={
  // currentUser stays local (per-device session)
  get(k){try{return JSON.parse(localStorage.getItem(SK+k))||null}catch{return null}},
  set(k,v){try{localStorage.setItem(SK+k,JSON.stringify(v))}catch{}},
  currentUser(){return this.get('currentUser')},

  users(){return CACHE.users||this.get('users')||[]},
  matches(){return CACHE.matches||this.get('matches')||buildMatches()},
  predictions(){return CACHE.predictions||this.get('predictions')||{}},

  saveUsers(u){
    CACHE.users=u; this.set('users',u);
    if(FB_OK){fdb.collection('app').doc('users').set({list:u}).catch(e=>console.warn('users sync',e));}
  },
  saveMatches(m){
    CACHE.matches=m; this.set('matches',m);

// ── نسخة احتياطية محلية لقائمة المستخدمين (تنمو فقط، لا تتقلص) ──
// تحفظ كلمات المرور الأصلية حتى لو مُحيت من الخادم، لاسترجاعها لاحقاً.
const UBAK_KEY='users_bak';
function loadUserBak(){return DB.get(UBAK_KEY)||[];}
function mergeIntoUserBak(list){
  if(!Array.isArray(list)||!list.length) return;
  const byName={};
  loadUserBak().forEach(u=>{if(u&&u.username)byName[u.username.toLowerCase()]=u;});
  list.forEach(u=>{
    if(!u||!u.username) return;
    const k=u.username.toLowerCase(), ex=byName[k];
    if(!ex) byName[k]=u;                                   // مستخدم جديد
    else if((!ex.password)&&u.password) byName[k]=u;        // فضّل النسخة التي تحمل كلمة مرور
  });
  DB.set(UBAK_KEY,Object.values(byName));
}

// Hydrate cache from Firestore once, then set up live listeners.
async function initData(){
  // احفظ أي قائمة محلية (قد تحوي بيانات ما قبل المحو) قبل أي قراءة من الخادم
  mergeIntoUserBak(DB.get('users')||[]);
  if(!FB_OK){
    // local-only fallback
    CACHE.users=DB.get('users')||[];
    CACHE.matches=DB.get('matches')||buildMatches();
    CACHE.predictions=DB.get('predictions')||{};
    ensureAdmin(); ensureMatches();
    render();
    return;
  }
  try{
    const [uSnap,mSnap,pSnap]=await Promise.all([
      fdb.collection('app').doc('users').get(),
      fdb.collection('app').doc('matches').get(),
      fdb.collection('app').doc('predictions').get()
    ]);
    CACHE.users = uSnap.exists ? (uSnap.data().list||[]) : [];
    CACHE.matches = mSnap.exists ? (mSnap.data().list||buildMatches()) : buildMatches();
    CACHE.predictions = pSnap.exists ? (pSnap.data().data||{}) : {};
    mergeIntoUserBak(CACHE.users); // حدّث النسخة الاحتياطية بأي مستخدمين جدد من الخادم
    // seed defaults if first run
    ensureAdmin(); ensureMatches();
    render();
    // live listeners — update cache + refresh current view when data changes elsewhere
    fdb.collection('app').doc('users').onSnapshot(s=>{if(s.exists){CACHE.users=s.data().list||[];softRefresh();}});
    fdb.collection('app').doc('matches').onSnapshot(s=>{if(s.exists){CACHE.matches=s.data().list||CACHE.matches;softRefresh();}});
    fdb.collection('app').doc('predictions').onSnapshot(s=>{if(s.exists){CACHE.predictions=s.data().data||{};softRefresh();}});
  }catch(e){
    console.warn('Firestore load failed, using local:',e);
    // مهم: لا نكتب أي شيء على الخادم هنا — القراءة فشلت، فالكتابة ستمحو
    // بيانات الخادم الحقيقية (المستخدمون/النتائج). نكتفي بالعرض من النسخة المحلية.
    CACHE.users=DB.get('users')||[];
    CACHE.matches=DB.get('matches')||buildMatches();
    CACHE.predictions=DB.get('predictions')||{};
    if(!CACHE.users.find(u=>u.username==='admin')){
      CACHE.users=[...CACHE.users,{username:'admin',password:'admin2026',name:'حسن العاقول',isAdmin:true}];
    }
    DB.set('users',CACHE.users); // محلي فقط
    render();
  }
}
let _refreshT=null;
function softRefresh(){
  // re-render the current page only if logged in, debounced
  if(!DB.currentUser()) return;
  if(_refreshT) clearTimeout(_refreshT);
  _refreshT=setTimeout(()=>{ updateHeroStats(); showPage(curView); },300);
}
function ensureMatches(){
  if(!CACHE.matches||!CACHE.matches.length){
    CACHE.matches=buildMatches();
    DB.saveMatches(CACHE.matches);
  }
}
// قراءة أحدث قائمة مستخدمين من السيرفر مباشرة (تتجاوز أي كاش قديم)
// يعيد {users, ok} — ok=false عند فشل القراءة من السيرفر (للتمييز بين خطأ الشبكة وكلمة المرور)
async function fetchUsersFresh(){
  if(!FB_OK) return DB.users();
  try{
    const s=await fdb.collection('app').doc('users').get({source:'server'});
    if(s.exists){CACHE.users=s.data().list||[];mergeIntoUserBak(CACHE.users);DB.set('users',CACHE.users);}
    window._usersFetchOk=true;
  }catch(e){
    try{
      const s=await fdb.collection('app').doc('users').get();
      if(s.exists){CACHE.users=s.data().list||[];mergeIntoUserBak(CACHE.users);DB.set('users',CACHE.users);}
      window._usersFetchOk=true;
    }catch(e2){console.warn('fetchUsersFresh failed',e2);window._usersFetchOk=false;}
  }
  return DB.users();
}
// تعديل آمن على قائمة المستخدمين بمعاملة (يمنع تعارض الكتابة بين الأجهزة)
async function mutateUsers(mutator){
  if(!FB_OK){
    const users=DB.users();
    const result=mutator(users);
    if(result!==false){CACHE.users=users;DB.set('users',users);}
    return result;
  }
  const ref=fdb.collection('app').doc('users');
  let outcome;
  await fdb.runTransaction(async tx=>{
    const snap=await tx.get(ref);
    const list=snap.exists?(snap.data().list||[]):[];
    outcome=mutator(list);
    if(outcome===false) return; // ألغى التعديل
    tx.set(ref,{list});
    CACHE.users=list;DB.set('users',list);
  });
  return outcome;
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function now(){return Date.now()}
function canPredict(m){const d=m.ts-now(); return d>0 && d<172800000} // مفتوح فقط خلال آخر 48 ساعة قبل المباراة
function tooEarly(m){return m.ts-now()>=172800000} // أكثر من 48 ساعة على الموعد
function isActive(m){return now()>=m.ts && !m.official}
function within48h(m){const d=m.ts-now(); return d>-7200000&&d<172800000}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'})}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ar-SA',{weekday:'short',month:'short',day:'numeric',timeZone:'Asia/Riyadh'})}
function teamName(full){return full.split(' ').slice(1).join(' ')||full}
function teamFlag(full){return full.split(' ')[0]}
// مباراة إقصائية (كل ما هو ليس دور مجموعات)
function isKO(m){return m.stage!=='دور المجموعات';}
const METH_SHORT={reg:'أصلي',aet:'إضافي',pen:'ركلات'};
function hasPred(p){return p&&(p.r1!=null||p.win!=null);}
function actualWinner(m){
  if(m.method==='pen') return m.win||0;
  const a=Number(m.r1),b=Number(m.r2);
  return a>b?1:b>a?2:0;
}
function predWinner(p){
  if(p.method==='aet'||p.method==='pen') return p.win||0;
  if(p.r1==null||p.r2==null) return 0;
  const a=Number(p.r1),b=Number(p.r2);
  if(isNaN(a)||isNaN(b)) return 0;
  return a>b?1:b>a?2:0;
}
// نص مختصر لتوقع المستخدم
function predLabel(p,m){
  if(!hasPred(p)) return '';
  if(isKO(m)&&(p.method==='aet'||p.method==='pen')){
    const w=p.win===1?teamName(m.t1):p.win===2?teamName(m.t2):'؟';
    return `فوز ${w} ${p.method==='pen'?'بالركلات':'بالإضافي'}`;
  }
  return (p.r1!=null&&p.r2!=null)?`${p.r1}-${p.r2}`:'';
}
// نص نتيجة المباراة الرسمية
function resultLabel(m){
  if(!m.official) return '';
  if(isKO(m)&&m.method==='pen'){
    const w=m.win===1?teamName(m.t1):teamName(m.t2);
    return `فوز ${w} بالركلات`;
  }
  let s=`${m.r1}-${m.r2}`;
  if(isKO(m)&&m.method==='aet') s+=' (بعد الإضافي)';
  return s;
}
function calcPts(pred,m){
  if(!m||!m.official) return null;
  if(!isKO(m)){
    if(m.r1===null) return null;
    const [pr1,pr2,rr1,rr2]=[pred.r1,pred.r2,m.r1,m.r2].map(Number);
    if(isNaN(pr1)||isNaN(pr2)) return 0;
    if(pr1===rr1&&pr2===rr2) return 5;
    const po=pr1>pr2?1:pr1<pr2?-1:0, ro=rr1>rr2?1:rr1<rr2?-1:0;
    return po===ro?2:0;
  }
  // ── دور إقصائي: 0/2/3/5 ──
  const aw=actualWinner(m), pw=predWinner(pred);
  if(!pw||!aw||pw!==aw) return 0;                 // الفائز خطأ
  const am=m.method||'reg', pm=pred.method||'reg';
  if(pm==='reg'&&am==='reg'){                      // كلاهما وقت أصلي
    return (Number(pred.r1)===Number(m.r1)&&Number(pred.r2)===Number(m.r2))?5:2;
  }
  if(pm===am){                                     // طريقة الحسم صحيحة
    if(am==='pen') return 5;                        // فائز + ركلات
    if(am==='aet') return 3;                        // فائز + إضافي
    return 2;
  }
  return 2;                                         // الفائز صحيح لكن الطريقة مختلفة
}
function userStats(un){
  const preds=DB.predictions()[un]||{};
  const matches=DB.matches();
  let total=0,count=0,correct=0,half=0,wrong=0;
  for(const mid in preds){
    const m=matches.find(x=>x.id===mid);
    if(!m||!m.official) continue;
    const pts=calcPts(preds[mid],m);
    if(pts!==null){total+=pts;count++;if(pts===5)correct++;else if(pts>0)half++;else wrong++;}
  }
  return{total,count,correct,half,wrong};
}
function leaderboard(){
  return DB.users().filter(u=>!u.isAdmin)
    .map(u=>({...u,...userStats(u.username)}))
    .sort((a,b)=>b.total-a.total||(b.correct-a.correct)||(b.half-a.half));
}
function updateHeroStats(){
  const lb=leaderboard();
  document.getElementById('hs-players').textContent=lb.length;
  document.getElementById('hs-top').textContent=lb[0]?.total||0;
  if(lb.length>0) document.getElementById('hero-stats').style.display='flex';
}

// Stars
(function(){
  const c=document.getElementById('stars-bg');
  if(!c) return;
  for(let i=0;i<40;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=Math.random()*2+1;
    s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s`;
    c.appendChild(s);
  }
})();

let notifTimer=null;
function showNotif(text,icon='✅',dur=3000){
  document.getElementById('notif-icon').textContent=icon;
  document.getElementById('notif-text').textContent=text;
  document.getElementById('notif').classList.add('show');
  if(notifTimer) clearTimeout(notifTimer);
  notifTimer=setTimeout(closeNotif,dur);
}
function closeNotif(){document.getElementById('notif').classList.remove('show');}

}

// ── استرجاع الحسابات من النسخة المحلية على هذا الجهاز ──
async function recoverAccounts(){
  const bak=loadUserBak();
  const real=bak.filter(u=>u&&u.username&&u.username.toLowerCase()!=='admin'&&u.password);
  if(!real.length){showInlineMsg('lmsg','لا توجد نسخة محلية للحسابات على هذا الجهاز','err');return;}
  if(!confirm(`تم العثور على ${real.length} حساباً محفوظاً على هذا الجهاز (بكلمات المرور).\n\nاسترجاعها إلى الخادم الآن؟`)) return;
  showInlineMsg('lmsg','⏳ جاري استرجاع الحسابات...','ok');
  try{
    await mutateUsers(list=>{
      const byName={};
      list.forEach(u=>{if(u&&u.username)byName[u.username.toLowerCase()]=u;});
      // أضف حسابات النسخة المحلية التي لا توجد على الخادم
      bak.forEach(u=>{if(u&&u.username){const k=u.username.toLowerCase();if(!byName[k])byName[k]=u;}});
      if(!byName['admin'])byName['admin']={username:'admin',password:'admin2026',name:'حسن العاقول',isAdmin:true};
      list.length=0; Object.values(byName).forEach(u=>list.push(u));
      return true;
    });
    showInlineMsg('lmsg',`✓ تم استرجاع ${real.length} حساباً بنجاح! يمكن للمشاركين الدخول الآن.`,'ok');
  }catch(e){showInlineMsg('lmsg','تعذّر الاسترجاع — تحقق من الإنترنت وأعد المحاولة','err');}
}

function stageIcon(s){
  const map={'دور المجموعات':'⚽','دور الـ32':'32','دور الـ16':'16','ربع النهائي':'⚡','نصف النهائي':'🔥','المركز الثالث':'🥉','النهائي 🏆':'🏆'};
  return map[s]||'⚽';
}
function stageColor(s){
  if(s.includes('نهائي')||s.includes('🏆')) return 'bg';
  if(s.includes('ربع')) return 'bo';
  if(s.includes('32')||s.includes('16')) return 'bbl';
  return 'bm';
}

          <option value="2">${teamName(m.t2)}</option>
        </select>
      </div>`:''}

    html+=`<div class="sec-title" style="margin-top:1rem"><span class="icon">✅</span> نتائج محسومة (${done.length})</div>

      </div>`;
    });
    html+=`</div>`;
  }

  topSubj:['المتصدر','البطل','صاحب الصدارة','قائد الترتيب','الأول','الرقم واحد','نجم المسابقة','أسطورة التوقعات','ملك النقاط','صاحب العرش'],
  topVerb:['يحلّق عالياً','يتألق','يبدع','يقود بثقة','يفرض سيطرته','يكتب التاريخ','يخطف الأنظار','يثبت جدارته','يواصل تألقه','يصنع الفارق'],
  topTail:['ولا منافس','بلا منازع','وعينه على الكأس','والجميع يلاحقه','بجدارة واستحقاق','كما يفعل الكبار','في كل جولة','حتى النهاية','بأعصاب باردة','بموهبة فذة'],
  raceMid:['يشتعل','يحتدم','يقترب من الحسم','يقلب الموازين','لا يرحم','يحبس الأنفاس','يفاجئ الجميع','يتغيّر كل لحظة','يعد بالمزيد','على صفيح ساخن'],
  raceTail:['ومن يخطئ يدفع الثمن','والمفاجآت قادمة','فاستعدوا','لا مكان للضعفاء','والقادم أعظم','حتى آخر صافرة','والكل يترقب','فابقوا متيقظين','والحظوظ مفتوحة','والإثارة مستمرة'],
  botStart:['لا تيأس','واصل المحاولة','الأمل موجود','ارفع رأسك','لا تستسلم','ابتسم','ثق بنفسك','اصبر','القادم أفضل','حظك سيتغير'],
  botTail:['فالبطولة طويلة','والعودة ممكنة','والمعجزات تحدث','فكل بداية صعبة','والزمن كفيل بالباقي','فالكرة لا تنتهي','والريمونتادا واردة','فالأبطال يعودون','والجولة القادمة لك','فلا شيء مستحيل'],
  emoT:['🔥','🏆','👑','⚡','🌟','💪','🎯','🦅','✨','🚀'],
  emoR:['🔥','⚔️','📣','🎲','💢','😮‍💨','🌍','⚙️','🎺','🏁'],
  emoB:['💪','🌱','📈','🍀','😊','🕯️','🔄','📚','⏳','🙂']
};
function _pick(a){return a[Math.floor(Math.random()*a.length)]}
function genTop(){
  const f=[
    ()=>`${_pick(_G.topSubj)} ${_pick(_G.topVerb)} ${_pick(_G.topTail)} ${_pick(_G.emoT)}`,
    ()=>`${_pick(_G.topVerb)} ${_pick(_G.topTail)} ${_pick(_G.emoT)}`,
    ()=>`${_pick(_G.topSubj)} ${_pick(_G.topVerb)} ${_pick(_G.emoT)}`
  ];
  return _pick(f)();
}
function genRace(){
  const f=[
    ()=>`السباق ${_pick(_G.raceMid)} ${_pick(_G.raceTail)} ${_pick(_G.emoR)}`,
    ()=>`الترتيب ${_pick(_G.raceMid)} ${_pick(_G.raceTail)} ${_pick(_G.emoR)}`,
    ()=>`المنافسة ${_pick(_G.raceMid)} ${_pick(_G.raceTail)} ${_pick(_G.emoR)}`
  ];
  return _pick(f)();
}
function genBottom(){
  return `${_pick(_G.botStart)}... ${_pick(_G.botTail)} ${_pick(_G.emoB)}`;
}
// يدمج القوائم اليدوية مع المولّد (احتمال 50% لكل منهما) لتنوّع شبه لا نهائي
function hypeTop(){ return Math.random()<0.5 ? pickHype(HYPE_TOP,'top') : genTop(); }
function hypeRace(){ return Math.random()<0.5 ? pickHype(HYPE_RACE,'race') : genRace(); }
function hypeBottom(){ return Math.random()<0.5 ? pickHype(HYPE_BOTTOM,'bottom') : genBottom(); }

function pickHype(arr,key){
  if(arr.length<=1) return arr[0];
  let pick, tries=0;
  do{ pick=arr[Math.floor(Math.random()*arr.length)]; tries++; }
  while(pick===_lastHype[key] && tries<20);
  _lastHype[key]=pick;
  return pick;
}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)]}

function buildLeaderboardCanvas(){
  const lb=leaderboard();
  if(!lb.length) return null;

  const SCALE=2; // دقة مضاعفة لوضوح أعلى عند العرض والمشاركة
  const W=900;
  const rowH=96, topRowH=132; // المراكز الثلاثة الأولى أطول لاستيعاب العبارة
  const topCount=Math.min(3,lb.length);
  const headerH=lb.length>=3?320:270; // مساحة إضافية لعبارة المركز الأخير
  const footerH=80;
  const rowsH=topCount*topRowH+(lb.length-topCount)*rowH;
  const H=headerH+rowsH+footerH;
  const cv=document.createElement('canvas');
  cv.width=W*SCALE; cv.height=H*SCALE;
  const x=cv.getContext('2d');
  x.scale(SCALE,SCALE);

  // Background gradient
  const bg=x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#060d1a');bg.addColorStop(.5,'#0d1e38');bg.addColorStop(1,'#060d1a');
  x.fillStyle=bg;x.fillRect(0,0,W,H);

  // Subtle stars
  x.fillStyle='rgba(255,255,255,.25)';
  for(let i=0;i<60;i++){
    x.beginPath();
    x.arc(Math.random()*W,Math.random()*H,Math.random()*1.5+0.5,0,7);
    x.fill();
  }

  // Gold top glow
  const glow=x.createRadialGradient(W/2,0,50,W/2,0,420);
  glow.addColorStop(0,'rgba(201,168,76,.30)');glow.addColorStop(1,'transparent');
  x.fillStyle=glow;x.fillRect(0,0,W,420);

  x.textAlign='center';
  // Trophy
  x.font='64px serif';
  x.fillText('🏆',W/2,86);
  // Title
  x.fillStyle='#F0D080';
  x.font='bold 44px Tajawal, Arial';
  x.fillText('ترتيب مسابقة كأس العالم 2026',W/2,150);
  // Date line
  const dateStr=new Date().toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Riyadh'});
  const timeStr=new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'});
  x.fillStyle='#7a94b4';
  x.font='24px Tajawal, Arial';
  x.fillText(`${dateStr} - ${timeStr}`,W/2,192);
  // Hype line (rotating race phrase)
  x.fillStyle='#C9A84C';
  x.font='bold 27px Tajawal, Arial';
  x.fillText(hypeRace(),W/2,238);
  // عبارة المركز الأخير في العنوان
  if(lb.length>=3){
    const last=lb[lb.length-1];
    x.fillStyle='#7a94b4';
    x.font='23px Tajawal, Arial';
    x.fillText(`${last.name}: ${hypeBottom()}`,W/2,282);
  }

  // Rows
  const medals=['🥇','🥈','🥉'];
  const rankHypes=[hypeTop(),pickHype(HYPE_SECOND,'second'),pickHype(HYPE_THIRD,'third')];
  const hypeColors=['#FFD700','#C0C0C0','#CD7F32'];
  const maxPts=lb[0].total||1;
  let y=headerH;
  lb.forEach((u,i)=>{
    const rh=i<3?topRowH:rowH;
    const isTop=i===0;
    // Row card
    x.fillStyle=isTop?'rgba(201,168,76,.13)':i<3?'rgba(20,33,54,.9)':'rgba(16,29,48,.85)';
    roundRect(x,30,y+8,W-60,rh-16,16);
    x.fill();
    x.strokeStyle=isTop?'rgba(255,215,0,.5)':i===1?'rgba(192,192,192,.35)':i===2?'rgba(205,127,50,.35)':'rgba(28,45,69,.9)';
    x.lineWidth=isTop?2.5:1.5;
    roundRect(x,30,y+8,W-60,rh-16,16);
    x.stroke();

    const cy=i<3?y+rh/2-14:y+rh/2; // مركز السطر الأول (الاسم/النقاط) أعلى قليلاً في بطاقات الثلاثة الأوائل

    // Rank medal/number (right side, RTL)
    x.textAlign='center';
    x.font=i<3?'40px serif':'bold 32px Tajawal, Arial';
    x.fillStyle=i===0?'#FFD700':i===1?'#C0C0C0':i===2?'#CD7F32':'#5a7494';
    x.fillText(i<3?medals[i]:String(i+1),W-80,cy+14);

    // Name
    x.textAlign='right';
    x.fillStyle=isTop?'#F0D080':'#d8e8f8';
    x.font='bold 30px Tajawal, Arial';
    x.fillText(u.name,W-135,cy-2);
    // Stats line
    x.fillStyle='#7a94b4';
    x.font='21px Tajawal, Arial';
    x.fillText(`${u.correct} صحيحة | ${u.half} جزئية | ${u.count} متوقعة`,W-135,cy+30);

    // عبارة تحفيزية داخل بطاقات المراكز الثلاثة الأولى
    if(i<3){
      x.textAlign='right';
      x.fillStyle=hypeColors[i];
      x.font='bold 23px Tajawal, Arial';
      x.fillText(rankHypes[i],W-135,y+rh-26);
    }

    // Points (left)
    x.textAlign='left';
    x.fillStyle='#C9A84C';
    x.font='bold 44px Cairo, Tajawal, Arial';
    x.fillText(String(u.total),58,cy+16);

    // Progress bar
    const barW=200, barX=140, barY=cy+4;
    x.fillStyle='rgba(28,45,69,.9)';
    roundRect(x,barX,barY,barW,8,4);x.fill();
    x.fillStyle='#C9A84C';
    const fw=Math.max(8,Math.round(barW*(u.total/maxPts)));
    roundRect(x,barX,barY,fw,8,4);x.fill();

    y+=rh;
  });

  // Footer
  const fy=y;
  x.strokeStyle='rgba(201,168,76,.3)';x.lineWidth=1;
  x.beginPath();x.moveTo(60,fy+18);x.lineTo(W-60,fy+18);x.stroke();
  x.textAlign='center';
  // Credit
  x.fillStyle='#5a7494';
  x.font='21px Tajawal, Arial';
  x.fillText('مسابقة توقع كأس العالم 2026 | إعداد: حسن العاقول',W/2,fy+52);

  return {cv,W,H};
}

function exportLeaderboardImage(){
  const built=buildLeaderboardCanvas();
  if(!built){showNotif('لا يوجد مشاركون لتصديرهم','⚠️');return;}
  showNotif('جاري إنشاء الصورة...','📸',2000);
  built.cv.toBlob(async blob=>{
    if(!blob){showNotif('تعذر إنشاء الصورة','⚠️');return;}
    const file=new File([blob],'leaderboard.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'ترتيب مسابقة كأس العالم 2026'});
        return;
      }catch(e){}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='ترتيب-المسابقة.png';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    showNotif('✓ تم تنزيل الصورة — شاركها واتساب','📸',4000);
  },'image/png');
}

// ═══ تقرير يومي / شامل بالنتائج + الترتيب ═══
function buildReportCanvas(mode){
  const matches=DB.matches().filter(m=>m.official);
  if(!matches.length) return null;
  const lb=leaderboard();
  const SCALE=2, W=900;
  const PAD=40;

  // فلترة حسب الوضع
  const todayStr=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'}); // YYYY-MM-DD
  function matchDateStr(m){return new Date(m.ts).toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});}
  let shown=matches;
  if(mode==='today'){
    shown=matches.filter(m=>matchDateStr(m)===todayStr);
  }
  // تجميع حسب التاريخ (تنازلي: الأحدث أولاً)
  const byDate={};
  shown.forEach(m=>{(byDate[matchDateStr(m)]=byDate[matchDateStr(m)]||[]).push(m);});
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));

  // حساب الارتفاع
  const headerH=200;
  let bodyH=0;
  dates.forEach(d=>{ bodyH+=54; bodyH+=byDate[d].length*112; bodyH+=16; });
  const lbTitleH=64;
  const lbH=Math.min(lb.length,12)*60+20;
  const footerH=70;
  const H=headerH+bodyH+lbTitleH+lbH+footerH;

  const cv=document.createElement('canvas');
  cv.width=W*SCALE; cv.height=H*SCALE;
  const x=cv.getContext('2d');
  x.scale(SCALE,SCALE);

  // خلفية
  const bg=x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#060d1a');bg.addColorStop(.5,'#0d1e38');bg.addColorStop(1,'#060d1a');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.2)';
  for(let i=0;i<50;i++){x.beginPath();x.arc(Math.random()*W,Math.random()*H,Math.random()*1.3+.4,0,7);x.fill();}
  const glow=x.createRadialGradient(W/2,0,40,W/2,0,380);
  glow.addColorStop(0,'rgba(201,168,76,.28)');glow.addColorStop(1,'transparent');
  x.fillStyle=glow;x.fillRect(0,0,W,380);

  // العنوان
  x.textAlign='center';
  x.font='52px serif';x.fillText('📋',W/2,80);
  x.fillStyle='#F0D080';x.font='bold 40px Tajawal, Arial';
  x.fillText(mode==='today'?'تقرير اليوم':'التقرير الشامل',W/2,138);
  const dStr=new Date().toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Riyadh'});
  const tStr=new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'});
  x.fillStyle='#7a94b4';x.font='22px Tajawal, Arial';
  x.fillText(`${dStr} - ${tStr}`,W/2,176);

  let y=headerH;
  if(!dates.length){
    x.fillStyle='#7a94b4';x.font='24px Tajawal, Arial';x.textAlign='center';
    x.fillText('لا توجد نتائج محسومة في هذا اليوم',W/2,y+40);
    y+=80;
  }
  dates.forEach(d=>{
    // عنوان التاريخ
    const dispDate=new Date(d+'T12:00:00').toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Riyadh'});
    x.fillStyle='rgba(201,168,76,.13)';
    roundRect(x,PAD,y+8,W-2*PAD,38,10);x.fill();
    x.textAlign='right';x.fillStyle='#F0D080';x.font='bold 22px Tajawal, Arial';
    x.fillText('📅 '+dispDate,W-PAD-16,y+34);
    y+=54;
    // المباريات
    byDate[d].forEach(m=>{
      x.fillStyle='rgba(16,29,48,.85)';
      roundRect(x,PAD,y+6,W-2*PAD,100,14);x.fill();
      x.strokeStyle='rgba(28,45,69,.9)';x.lineWidth=1.5;
      roundRect(x,PAD,y+6,W-2*PAD,100,14);x.stroke();
      // أسماء + نتيجة
      x.textAlign='center';
      x.fillStyle='#d8e8f8';x.font='bold 26px Tajawal, Arial';
      x.fillText(isKO(m)&&m.method==='pen'
        ?`${teamName(m.t1)}  🥅 ركلات  ${teamName(m.t2)}`
        :`${teamName(m.t1)}  ${m.r1} - ${m.r2}${isKO(m)&&m.method==='aet'?' (إضافي)':''}  ${teamName(m.t2)}`,W/2,y+38);
      // من أصاب النتيجة
      const preds=DB.predictions(), users=DB.users().filter(u=>!u.isAdmin);
      let exact=0,winner=0;
      const exactNames=[];
      users.forEach(u=>{
        const p=preds[u.username]?.[m.id];
        if(!p) return;
        const pts=calcPts(p,m);
        if(pts===5){exact++;exactNames.push(u.name);}
        else if(pts===2)winner++;
      });
      x.fillStyle='#7a94b4';x.font='17px Tajawal, Arial';
      x.fillText(`⭐ ${exact} أصابوا النتيجة  |  ✅ ${winner} أصابوا الفائز`,W/2,y+66);
      // أسماء المصيبين بالضبط
      if(exactNames.length){
        x.fillStyle='#C9A84C';x.font='bold 15px Tajawal, Arial';
        const namesTxt='⭐ '+exactNames.join('  •  ');
        x.fillText(namesTxt,W/2,y+90);
      }
      y+=112;
    });
    y+=16;
  });

  // الترتيب الحالي
  x.textAlign='center';
  x.fillStyle='#F0D080';x.font='bold 30px Tajawal, Arial';
  x.fillText('🏆 الترتيب الحالي',W/2,y+44);
  y+=lbTitleH;
  const medals=['🥇','🥈','🥉'];
  lb.slice(0,12).forEach((u,i)=>{
    x.fillStyle=i===0?'rgba(201,168,76,.13)':'rgba(16,29,48,.8)';
    roundRect(x,PAD,y+4,W-2*PAD,52,12);x.fill();
    x.textAlign='center';x.font=i<3?'26px serif':'bold 22px Tajawal, Arial';
    x.fillStyle=i===0?'#FFD700':i===1?'#C0C0C0':i===2?'#CD7F32':'#5a7494';
    x.fillText(i<3?medals[i]:String(i+1),W-PAD-40,y+38);
    x.textAlign='right';x.fillStyle=i===0?'#F0D080':'#d8e8f8';x.font='bold 24px Tajawal, Arial';
    x.fillText(u.name,W-PAD-90,y+38);
    x.textAlign='left';x.fillStyle='#C9A84C';x.font='bold 30px Cairo, Tajawal, Arial';
    x.fillText(String(u.total),PAD+24,y+40);
    x.fillStyle='#7a94b4';x.font='15px Tajawal, Arial';
    x.fillText('نقطة',PAD+80,y+40);
    y+=60;
  });

  // التذييل
  x.textAlign='center';x.fillStyle='#5a7494';x.font='19px Tajawal, Arial';
  x.fillText('مسابقة توقع كأس العالم 2026 | إعداد: حسن العاقول',W/2,y+40);

  return {cv,W,H};
}

// ── SCORING CARD ──────────────────────────────────────────────
function buildScoringCard(){
  const W=720, H=1080;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  const gold='#C9A84C', gold2='#F0D080', gold3='#ffeaa0';
  const dark='#060d1a', card='#0c1628', card2='#0e1a2c';
  const green='#00c853', red='#f44336', blue='#3d8ef0', orange='#ff9800';
  const text='#d8e8f8', muted='#5a7494', muted2='#7a94b4';

  // خلفية
  const bg=cx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#040c1c'); bg.addColorStop(0.5,'#0a1628'); bg.addColorStop(1,'#040c1c');
  cx.fillStyle=bg; cx.fillRect(0,0,W,H);

  // نجوم عشوائية
  cx.fillStyle='rgba(255,255,255,0.25)';
  [[40,60],[680,90],[120,200],[600,150],[30,400],[700,380],[80,700],[650,720],[350,50],[360,1030]].forEach(([x,y])=>{
    cx.beginPath(); cx.arc(x,y,1.2,0,Math.PI*2); cx.fill();
  });

  // خط ذهبي علوي
  const glowTop=cx.createLinearGradient(0,0,W,0);
  glowTop.addColorStop(0,'transparent'); glowTop.addColorStop(0.5,gold); glowTop.addColorStop(1,'transparent');
  cx.fillStyle=glowTop; cx.fillRect(0,0,W,2);

  // هيدر
  cx.fillStyle=gold+'22'; cx.fillRect(0,0,W,130);
  cx.font='bold 28px Tajawal,Arial'; cx.fillStyle=gold2; cx.textAlign='center';
  cx.fillText('🏆  كأس العالم 2026  🏆',W/2,52);
  cx.font='bold 36px Tajawal,Arial'; cx.fillStyle=gold3;
  cx.fillText('آلية احتساب النقاط',W/2,100);
  cx.font='20px Tajawal,Arial'; cx.fillStyle=muted2;
  cx.fillText('مسابقة توقع النتائج',W/2,128);

  // خط فاصل
  const sep1=cx.createLinearGradient(0,0,W,0);
  sep1.addColorStop(0,'transparent'); sep1.addColorStop(0.5,gold+'88'); sep1.addColorStop(1,'transparent');
  cx.fillStyle=sep1; cx.fillRect(0,140,W,1.5);

  // ── قسم 1: دور المجموعات ──
  let y=165;
  // عنوان القسم
  cx.fillStyle=card2+'cc'; cx.beginPath();
  cx.roundRect(30,y,W-60,44,10); cx.fill();
  cx.strokeStyle=blue+'88'; cx.lineWidth=1;
  cx.beginPath(); cx.roundRect(30,y,W-60,44,10); cx.stroke();
  cx.font='bold 22px Tajawal,Arial'; cx.fillStyle=blue; cx.textAlign='center';
  cx.fillText('⚽  دور المجموعات',W/2,y+29);

  y+=58;
  const rows1=[
    {pts:5, color:gold3,   bg:'#1a1400', border:gold+'66',   label:'النتيجة الصحيحة بالضبط',        ex:'توقعت 2-1  ✓  النتيجة 2-1'},
    {pts:2, color:'#a0c8ff',bg:'#091828', border:blue+'66',  label:'الفائز أو التعادل صحيح',         ex:'توقعت 2-1  ✓  النتيجة 3-1 (فوز صحيح)'},
    {pts:0, color:'#ff8a80',bg:'#1a0808', border:red+'55',   label:'توقع خاطئ',                      ex:'توقعت فوز  ✗  النتيجة تعادل أو خسارة'},

function roundRect(x,px,py,w,h,r){
  x.beginPath();
  x.moveTo(px+r,py);
  x.arcTo(px+w,py,px+w,py+h,r);
  x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r);
  x.arcTo(px,py,px+w,py,r);
  x.closePath();
}

function matchPredStats(m){
  // How many predicted exact / outcome / wrong for a finished match
  const preds=DB.predictions();
  let exact=0,outcome=0,wrong=0,total=0;
  for(const un in preds){
    const usr=DB.users().find(x=>x.username===un);
    if(!usr||usr.isAdmin) continue;
    const p=preds[un][m.id];
    if(!p) continue;
    total++;
    const pts=calcPts(p,m);
    if(pts===5)exact++;else if(pts===2)outcome++;else wrong++;
  }
  return{exact,outcome,wrong,total};
}

function buildDashboard(u){
  const lb=leaderboard();
  const matches=DB.matches();
  const done=matches.filter(m=>m.official);
  const totalPlayers=lb.length;
  const totalDone=done.length;
  const avgPts=totalPlayers?Math.round(lb.reduce((s,x)=>s+x.total,0)/totalPlayers):0;
  // accuracy for each player = correct+half predictions / count
  const lbAcc=lb.map(p=>({...p,acc:p.count?Math.round((p.correct+p.half)/p.count*100):0}));
  const myStats=u.isAdmin?null:userStats(u.username);
  const myRank=u.isAdmin?null:lb.findIndex(x=>x.username===u.username)+1;
  const myAcc=myStats&&myStats.count?Math.round((myStats.correct+myStats.half)/myStats.count*100):0;

  // next match
  const upcoming=matches.filter(m=>!m.official&&now()<m.ts).sort((a,b)=>a.ts-b.ts)[0];
  // last result
  const lastDone=[...done].sort((a,b)=>b.ts-a.ts)[0];

  let html=`<div style="margin-bottom:1rem">`;

  // Personal summary (non-admin)
  if(!u.isAdmin){

  // General stats

    html+=`<div class="card2" style="text-align:center;display:flex;flex-direction:column;justify-content:center"><div style="font-size:1.5rem">⏳</div><div style="font-size:.72rem;color:var(--muted);margin-top:.3rem">لا نتائج بعد</div></div>`;
  }
  html+=`</div>`;

  if(!totalPlayers){
    return html+`<div class="empty"><span class="empty-icon">📊</span>لا توجد بيانات كافية للإحصائيات بعد</div></div>`;
  }

  // Top 5 chart (points)
  html+=`<div class="card">
    <div class="sec-title"><span class="icon">🏅</span> أعلى 5 متصدرين بالنقاط</div>
    <div style="position:relative;height:200px"><canvas id="chart-top"></canvas></div>
  </div>`;

  // Accuracy chart
  html+=`<div class="card">
    <div class="sec-title"><span class="icon">🎯</span> نسبة دقة التوقعات</div>
    <div style="position:relative;height:${Math.max(120,lbAcc.length*34)}px"><canvas id="chart-acc"></canvas></div>
  </div>`;

  // Points distribution donut
  html+=`<div class="card">
    <div class="sec-title"><span class="icon">🍩</span> توزيع التوقعات (الكل)</div>
    <div style="position:relative;height:200px"><canvas id="chart-dist"></canvas></div>
  </div>`;

  // Lucky / unlucky
  const best=lbAcc[0], worst=lbAcc[lbAcc.length-1];
  html+=`<div class="two-col" style="margin-bottom:.875rem">
    <div class="card2" style="text-align:center;border-color:rgba(0,200,83,.3)">
      <div style="font-size:1.8rem">🍀</div>
      <div style="font-size:.66rem;color:var(--muted)">الأكثر حظاً</div>
      <div style="font-weight:700;font-size:.85rem;color:var(--green);margin-top:.2rem">${best?best.name:'-'}</div>
      <div style="font-size:.66rem;color:var(--muted2)">${best?best.total+' نقطة':''}</div>
    </div>
    <div class="card2" style="text-align:center;border-color:rgba(244,67,54,.3)">
      <div style="font-size:1.8rem">😅</div>
      <div style="font-size:.66rem;color:var(--muted)">الأقل حظاً</div>
      <div style="font-weight:700;font-size:.85rem;color:var(--red);margin-top:.2rem">${worst&&worst!==best?worst.name:'-'}</div>
      <div style="font-size:.66rem;color:var(--muted2)">${worst&&worst!==best?worst.total+' نقطة':''}</div>
    </div>
  </div>`;

  // Per-match stats (recent finished)
  if(done.length){
    html+=`<div class="card">
      <div class="sec-title"><span class="icon">📋</span> إحصائيات المباريات المنتهية</div>
      <div class="scroll-area" style="max-height:30vh">`;
    [...done].sort((a,b)=>b.ts-a.ts).forEach(m=>{
      const s=matchPredStats(m);
      const pct=s.total?Math.round(s.exact/s.total*100):0;
      html+=`<div style="padding:.5rem 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;font-size:.74rem;margin-bottom:.3rem">
          <span>${teamFlag(m.t1)} ${teamName(m.t1)} <strong style="color:var(--gold2)">${m.r1}-${m.r2}</strong> ${teamName(m.t2)} ${teamFlag(m.t2)}</span>
        </div>
        <div style="display:flex;gap:.5rem;font-size:.64rem;color:var(--muted)">
          <span class="badge bg" style="font-size:.6rem">⭐ ${s.exact}</span>
          <span class="badge bgr" style="font-size:.6rem">✅ ${s.outcome}</span>
          <span class="badge bb" style="font-size:.6rem">❌ ${s.wrong}</span>
          <span style="margin-right:auto">${pct}% أصابوا النتيجة</span>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  }

  html+=`</div>`;
  return html;
}

let _charts=[];
function drawDashboardCharts(){
  _charts.forEach(c=>{try{c.destroy()}catch{}});
  _charts=[];
  if(typeof Chart==='undefined') return;
  const lb=leaderboard();
  if(!lb.length) return;
  const gold='#C9A84C',green='#00c853',blue='#3d8ef0',red='#f44336',muted='#5a7494';
  Chart.defaults.font.family='Tajawal';
  Chart.defaults.color=muted;

  // Top 5 bar
  const top=lb.slice(0,5);
  const c1=document.getElementById('chart-top');
  if(c1)_charts.push(new Chart(c1,{type:'bar',data:{labels:top.map(p=>p.name),datasets:[{data:top.map(p=>p.total),backgroundColor:top.map((_,i)=>['#FFD700','#C0C0C0','#CD7F32',gold,gold][i]||gold),borderRadius:6}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{precision:0}},y:{grid:{display:false}}},maintainAspectRatio:false}}));

  // Accuracy horizontal bar
  const lbAcc=lb.map(p=>({name:p.name,acc:p.count?Math.round((p.correct+p.half)/p.count*100):0}));
  const c2=document.getElementById('chart-acc');
  if(c2)_charts.push(new Chart(c2,{type:'bar',data:{labels:lbAcc.map(p=>p.name),datasets:[{data:lbAcc.map(p=>p.acc),backgroundColor:gold+'cc',borderRadius:6}]},options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+'%'}}},scales:{x:{max:100,grid:{color:'rgba(255,255,255,.05)'},ticks:{callback:v=>v+'%'}},y:{grid:{display:false}}},maintainAspectRatio:false}}));

  // Distribution donut
  let ex=0,ou=0,wr=0;
  lb.forEach(p=>{ex+=p.correct;ou+=p.half;wr+=p.wrong;});
  const c3=document.getElementById('chart-dist');
  if(c3&&(ex+ou+wr>0))_charts.push(new Chart(c3,{type:'doughnut',data:{labels:['نتيجة صحيحة (5)','فائز صحيح (2)','خاطئة (0)'],datasets:[{data:[ex,ou,wr],backgroundColor:[green,blue,red],borderColor:'#0c1628',borderWidth:2}]},options:{plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:11}}}},maintainAspectRatio:false,cutout:'60%'}}));
}

function savePred(mid){
  const u=DB.currentUser();
  const m=DB.matches().find(x=>x.id===mid);
  if(!m||!canPredict(m)){
    const msg=m&&tooEarly(m)?'⏳ يُفتح التوقع قبل 48 ساعة من موعد المباراة':'🔒 التوقع مغلق بعد بداية المباراة';
    showInlineMsg('pmsg',msg,'err');return;
  }
  const pred=readPredInput(mid,m);
  if(pred.err){showInlineMsg('pmsg',pred.err,'err');return;}
  const preds=DB.predictions();
  if(!preds[u.username])preds[u.username]={};
  preds[u.username][mid]={...pred.value,savedAt:Date.now()};
  DB.savePredictions(preds);
  // تغذية بصرية على البطاقة نفسها دون إعادة تحميل الصفحة
  const btn=document.querySelector(`button[onclick="savePred('${mid}')"]`);
  if(btn){
    const orig=btn.innerHTML;
    btn.innerHTML='✓ تم الحفظ';
    btn.style.background='var(--green)';
    btn.style.color='#fff';
    setTimeout(()=>{btn.innerHTML=orig;btn.style.background='';btn.style.color='';},1500);
  }
}

// قراءة مدخلات توقّع مباراة (تعيد {value} أو {err})
function readPredInput(mid,m){
  if(isKO(m)){
    const meth=document.getElementById('meth-'+mid)?.value||'reg';
    if(meth==='reg'){
      const r1=document.getElementById('p1-'+mid)?.value;
      const r2=document.getElementById('p2-'+mid)?.value;
      if(r1===''||r2===''||r1==null||r2==null) return{err:'أدخل النتيجة كاملة'};
      return{value:{method:'reg',r1:parseInt(r1),r2:parseInt(r2)}};
    }
    const win=parseInt(document.getElementById('pw-'+mid)?.value||'0');
    if(!win) return{err:'اختر الفريق الفائز'};
    return{value:{method:meth,win}};
  }
  const r1=document.getElementById('p1-'+mid)?.value;
  const r2=document.getElementById('p2-'+mid)?.value;
  if(r1===''||r2===''||r1==null||r2==null) return{err:'أدخل النتيجة كاملة'};
  return{value:{r1:parseInt(r1),r2:parseInt(r2)}};
}

  if(!preds[u.username])preds[u.username]={};

function mapTeam(en){
  if(!en) return null;
  // تطبيع: حروف صغيرة + تحويل الشرطات لمسافات + إزالة المسافات الزائدة والرموز الخفية
  let k=String(en).toLowerCase()
    .replace(/[\u200b-\u200f\u202a-\u202e]/g,'')
    .replace(/[-_.]/g,' ')        // الشرطات والنقاط → مسافات
    .replace(/\s+/g,' ')
    .trim();
  if(TEAM_MAP[k]) return TEAM_MAP[k];
  // محاولة بدون أحرف غير أبجدية (مع دمج المسافات الناتجة)
  const k2=k.replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
  return TEAM_MAP[k2]||null;
}

// سجل تشخيصي يُملأ أثناء الجلب لعرضه للمستخدم
window._fetchDiag=[];
function _diag(msg){window._fetchDiag.push(msg);}
function _recentDays(n){
  const arr=[],now=new Date();
  for(let i=0;i<n;i++){const d=new Date(now);d.setDate(d.getDate()-i);arr.push(d.toISOString().slice(0,10));}
  return arr;
}
function _isFinished(e){
  const st=String(e.strStatus||'').toLowerCase();
  return st.includes('finish')||st==='ft'||st==='aet'||st==='pen'||st==='after extra time'||st==='after penalties';
}
function _isWorldCup(e){
  const lg=String(e.strLeague||'').toLowerCase();
  return lg.includes('world cup')||lg.includes('fifa');
}
function _evToResult(e){
  return{home:e.strHomeTeam,away:e.strAwayTeam,
    homeScore:parseInt(e.intHomeScore),awayScore:parseInt(e.intAwayScore),
    finished:true,date:e.dateEvent,league:e.strLeague};
}
function _hasScore(e){
  const a=e.intHomeScore,b=e.intAwayScore;
  return a!==null&&a!==''&&a!==undefined&&b!==null&&b!==''&&b!==undefined;
}
// جلب من TheSportsDB — يدعم CORS، مفتاح الاختبار المجاني
async function _fetchSportsDB(){
  const KEYS=['3','123'];
  // ① الأسلوب الأساسي: حسب التاريخ (لا يحتاج معرّف البطولة) — يلتقط كل مباريات الكأس المنتهية
  for(const KEY of KEYS){
    const seen=new Set(),out=[];
    let anyResp=false;
    for(const d of _recentDays(14)){
      try{
        const r=await fetch(`https://www.thesportsdb.com/api/v1/json/${KEY}/eventsday.php?d=${d}&s=Soccer`,{cache:'no-store'});
        if(!r.ok){_diag(`SportsDB(${KEY}) ${d}: HTTP ${r.status}`);continue;}
        anyResp=true;
        const j=await r.json();
        const evs=j.events||[];
        evs.forEach(e=>{
          if(!_isWorldCup(e)||!_isFinished(e)||!_hasScore(e))return;
          const k=e.idEvent||(e.strHomeTeam+e.strAwayTeam+e.dateEvent);
          if(seen.has(k))return; seen.add(k);
          out.push(_evToResult(e));
        });
      }catch(err){_diag(`SportsDB(${KEY}) ${d}: ${err.message}`);}
    }
    if(out.length){_diag(`SportsDB(${KEY}) حسب التاريخ: ${out.length} نتيجة`);return out;}
    if(anyResp)_diag(`SportsDB(${KEY}) حسب التاريخ: لا مباريات كأس منتهية في آخر 14 يوماً`);
  }
  // ② احتياطي: حسب الموسم بمعرّفات محتملة للبطولة
  const leagueIds=['4429','140280','140325','5587'];
  const seasons=['2026','2025-2026','2026-2027'];
  for(const KEY of KEYS){
    for(const id of leagueIds){
      for(const s of seasons){
        try{
          const r=await fetch(`https://www.thesportsdb.com/api/v1/json/${KEY}/eventsseason.php?id=${id}&s=${s}`,{cache:'no-store'});
          if(!r.ok)continue;
          const d=await r.json();
          const evs=d.events||[];
          if(!evs.length)continue;
          const out=evs.filter(e=>_isFinished(e)&&_hasScore(e)).map(_evToResult);
          if(out.length){_diag(`SportsDB(${KEY}) موسم id=${id} s=${s}: ${out.length} نتيجة`);return out;}
        }catch(_){}
      }
    }
  }
  _diag('SportsDB: لم تُرجِع أي نتائج من أي مسار');
  return [];
}
// جلب من openfootball على GitHub (يدعم CORS)
async function _fetchOpenfootball(){
  const urls=[
    'https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json',
    'https://raw.githubusercontent.com/openfootball/world-cup/master/2026/worldcup.json'
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) continue;
      const data=await r.json();
      const results=[];
      const sections=data.rounds||data.groups||[];
      for(const sec of sections){
        const ms=sec.matches||sec.games||[];
        for(const m of ms){
          const sc=m.score||m.result;
          if(!sc) continue;
          const ft=sc.ft||sc;
          if(!Array.isArray(ft)||ft.length<2||ft[0]===null) continue;
          const t1=m.team1||m.home_team, t2=m.team2||m.away_team;
          if(!t1||!t2) continue;
          const n1=typeof t1==='object'?(t1.name||t1.code):t1;
          const n2=typeof t2==='object'?(t2.name||t2.code):t2;
          results.push({home:n1,away:n2,homeScore:parseInt(ft[0]),awayScore:parseInt(ft[1]),finished:true});
        }
      }
      if(results.length){_diag(`openfootball: ${results.length} نتيجة`);return results;}
    }catch(err){_diag(`openfootball: ${err.message}`);continue;}
  }
  _diag('openfootball: لا بيانات 2026 متاحة بعد');
  return[];
}

  proposals.forEach((p,i)=>{

// ── EXCEL IMPORT ──────────────────────────────────────────────
function parseResult(val){
  if(val===null||val===undefined) return null;
  const s=String(val).trim();
  if(!s) return null;
  // accept formats: 2-1, 2:1, 2–1, "2 - 1"
  const m=s.match(/^(\d{1,2})\s*[-:–—xX]\s*(\d{1,2})$/);
  if(!m) return null;
  return {r1:parseInt(m[1]),r2:parseInt(m[2])};
}
function importExcel(){
  const inp=document.getElementById('xlsx-input');
  const file=inp?.files?.[0];
  if(!file){showInlineMsg('xlsx-msg','اختر ملف Excel أولاً','err');return;}
  if(typeof XLSX==='undefined'){showInlineMsg('xlsx-msg','مكتبة قراءة Excel لم تُحمّل، تحقق من الإنترنت','err');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){showInlineMsg('xlsx-msg','الملف فارغ أو لا يحتوي بيانات','err');return;}
      // find header indexes
      const header=rows[0].map(h=>String(h).trim().toLowerCase());
      let ri=header.indexOf('result');
      let si=header.indexOf('status');
      if(ri<0){showInlineMsg('xlsx-msg','لم يُعثر على عمود Result في الملف','err');return;}
      const dataRows=rows.slice(1);
      const matches=DB.matches();
      // Match by ORDER: row i ↔ matches[i] (both 104 in same official order)
      let applied=0, skipped=0, preview=[];
      dataRows.forEach((row,i)=>{
        const m=matches[i];
        if(!m) return;
        const res=parseResult(row[ri]);
        if(!res){skipped++;return;}
        m.r1=res.r1;m.r2=res.r2;m.official=true;
        applied++;
        if(preview.length<6) preview.push(`${teamName(m.t1)} ${res.r1}-${res.r2} ${teamName(m.t2)}`);
      });
      if(applied===0){showInlineMsg('xlsx-msg','لم يُعثر على أي نتيجة صالحة. اكتب النتائج بصيغة 2-1 في عمود Result','err');return;}
      DB.saveMatches(matches);
      showInlineMsg('xlsx-msg',`✓ تم استيراد ${applied} نتيجة وتوزيع النقاط${skipped?` (${skipped} صف بدون نتيجة)`:''}`,'ok');
      const pv=document.getElementById('xlsx-preview');
      if(pv) pv.innerHTML=`<div style="margin-top:.625rem;font-size:.72rem;color:var(--muted2)"><strong style="color:var(--gold)">عيّنة من النتائج المستوردة:</strong><br>${preview.map(p=>'• '+p).join('<br>')}${applied>6?`<br>... و ${applied-6} نتيجة أخرى`:''}</div>`;
      showNotif(`✓ استُوردت ${applied} نتيجة من الملف 🎉`,'📊',4000);
      setTimeout(()=>showPage('admin'),2500);
    }catch(err){
      showInlineMsg('xlsx-msg','خطأ في قراءة الملف: '+err.message,'err');
    }
  };
  reader.onerror=function(){showInlineMsg('xlsx-msg','تعذّر قراءة الملف','err');};
  reader.readAsBinaryString(file);
}

function saveResult(mid){
  const matches=DB.matches(), m=matches.find(x=>x.id===mid);
  if(!m) return;
  const meth=isKO(m)?(document.getElementById('arm-'+mid)?.value||'reg'):'reg';
  if(isKO(m)&&meth==='pen'){
    const win=parseInt(document.getElementById('arw-'+mid)?.value||'0');
    if(!win){showInlineMsg('amsg','اختر الفريق الفائز بالركلات','err');return;}
    m.r1=0;m.r2=0;m.method='pen';m.win=win;m.official=true;
  }else{
    const r1=document.getElementById('ar1-'+mid)?.value;
    const r2=document.getElementById('ar2-'+mid)?.value;
    if(r1===''||r2===''){showInlineMsg('amsg','أدخل النتيجة','err');return;}
    if(isKO(m)&&meth==='reg'&&parseInt(r1)===parseInt(r2)){
      showInlineMsg('amsg','في الأدوار الإقصائية لا يصحّ التعادل بالوقت الأصلي — اختر الإضافي أو الركلات','err');return;
    }
    m.r1=parseInt(r1);m.r2=parseInt(r2);m.method=meth;
    m.win=m.r1>m.r2?1:m.r2>m.r1?2:0;m.official=true;
  }
  DB.saveMatches(matches);
  showNotif('✓ تم تسجيل النتيجة وتوزيع النقاط تلقائياً 🎉','🏆',4000);
  setTimeout(()=>showPage('admin'),1200);
}
function delResult(mid){

function generatePassword(){
  // كلمة مرور سهلة القراءة والكتابة: 8 خانات أرقام وحروف واضحة (بدون 0/O/1/l المتشابهة)
  const chars='abcdefghjkmnpqrstuvwxyz23456789';

  for(let i=0;i<8;i++) pw+=chars[Math.floor(Math.random()*chars.length)];

}

  const newName=document.getElementById('newname')?.value?.trim();
  if(!newName){showInlineMsg('namemsg','أدخل الاسم الجديد','err');return;}
  if(newName.length<2){showInlineMsg('namemsg','الاسم قصير جداً','err');return;}
  if(newName.length>30){showInlineMsg('namemsg','الاسم طويل جداً (30 حرفاً كحد أقصى)','err');return;}
  if(newName===u.name){showInlineMsg('namemsg','هذا هو اسمك الحالي','err');return;}
  showInlineMsg('namemsg','⏳ جاري الحفظ...','ok');
  try{
    const ok=await mutateUsers(list=>{
      const t=list.find(x=>x.username===u.username);
      if(!t) return false;
      t.name=newName;
      return true;
    });
    if(ok===false){showInlineMsg('namemsg','تعذر إيجاد حسابك','err');return;}
  }catch(e){showInlineMsg('namemsg','تعذر الحفظ — تحقق من الإنترنت','err');return;}
  DB.set('currentUser',{...u,name:newName});
  showNotif(`✓ تم تغيير اسمك إلى: ${newName}`,'✏️');
  setTimeout(()=>{showPage('profile');},900);
}
async function changePw(){
  const u=DB.currentUser();
  const o=cleanInput(document.getElementById('pw1')?.value);
  const n=cleanInput(document.getElementById('pw2')?.value);
  if(!o||!n){showInlineMsg('pwmsg','أكمل الحقلين','err');return;}
  if(n.length<6){showInlineMsg('pwmsg','كلمة المرور الجديدة قصيرة جداً','err');return;}
  showInlineMsg('pwmsg','⏳ جاري الحفظ...','ok');
  try{
    const ok=await mutateUsers(list=>{
      const t=list.find(x=>x.username===u.username);
      if(!t) return false;
      if(cleanInput(t.password)!==o) return 'wrongpw';
      t.password=n;
      return true;
    });
    if(ok==='wrongpw'){showInlineMsg('pwmsg','كلمة المرور الحالية خاطئة','err');return;}
    if(ok===false){showInlineMsg('pwmsg','تعذر إيجاد حسابك','err');return;}
  }catch(e){showInlineMsg('pwmsg','تعذر الحفظ — تحقق من الإنترنت','err');return;}
  DB.set('currentUser',{...u,password:n});
  showInlineMsg('pwmsg','✓ تم تغيير كلمة المرور','ok');
}
function showInlineMsg(id,txt,type){
  const el=document.getElementById(id);
  if(!el) return;
  el.className=`msg msg-${type} show`;el.textContent=txt;
  setTimeout(()=>{el.className='msg';},3500);
}
